# A release per peripheral, refreshed on every push to main.
#
# The list is not written here: every module whose artifactId starts with "device-" or "tool-" is
# one, so a peripheral added tomorrow gets its release without this file changing.
name: Plugins

on:
  push:
    branches: [main]
    paths:
      - 'devices/**'
      - 'tools/**'
      - 'pom.xml'
      - '.github/workflows/plugins.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: plugins
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      devices: ${{ steps.list.outputs.devices }}
    steps:
      - uses: actions/checkout@v4

      # The emulator these are built against. Its artefacts are not published anywhere, so the
      # tree they come from is built here: a few minutes, and always the one main has today.
      - uses: actions/checkout@v4
        with:
          repository: fpetrola/oozx
          path: oozx

      # Y el framework contra el que los dos se compilan, que tampoco publica artefactos.
      - uses: actions/checkout@v4
        with:
          repository: fpetrola/crystal-plugins
          path: crystal-plugins

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      # -U because the runner keeps its ~/.m2 between runs: a download that failed once is
      # written down as having failed, and every later run repeats the answer instead of asking
      # again - which is how a plugin that is in central was reported as missing from it.
      #
      # skipTests and not maven.test.skip on purpose: the tests are compiled but not run, and
      # the test-jars of bridge and app - which the tests here are built against - are made of
      # what compiling them produced.
      - name: Build the plugin framework
        run: mvn -B -U -DskipTests install -f crystal-plugins/pom.xml

      - name: Build the emulator these plug into
        run: mvn -B -U -DskipTests install -f oozx/pom.xml

      # The whole reactor once: a plugin jar is small, but it is compiled against the machine.
      # Running the tests is the other workflow's job; this one only produces the artefacts.
      - name: Build
        run: mvn -B -U -DskipTests install

      - name: Find the devices
        id: list
        run: |
          python3 - <<'PY'
          import json, os, re, glob, shutil, sys

          def artifact_of(pom):
              """The module's own artifactId, which is the one outside <parent>."""
              text = re.sub(r'<parent>.*?</parent>', '', open(pom).read(), flags=re.S)
              found = re.search(r'<artifactId>([^<]+)</artifactId>', text)
              return found.group(1) if found else None

          def named(pom):
              """What the module calls itself, which is what it is for a person reading a list."""
              text = re.sub(r'<parent>.*?</parent>', '', open(pom).read(), flags=re.S)
              found = re.search(r'<name>([^<]+)</name>', text)
              return found.group(1) if found else None

          def called(module):
              """What the board calls itself in the Equipment menu, for the release to be named after.

              All of them, because a jar with two windows in it is two things in the menu and the
              release that brings it has to say so rather than name whichever file was read first.
              """
              names = []
              for source in sorted(glob.glob(module + '/src/main/java/**/*Equipment.java', recursive=True)):
                  said = re.search(r'name\(\)\s*\{\s*return\s+"([^"]+)"', open(source).read())
                  if said and said.group(1) not in names:
                      names.append(said.group(1))
              return ' + '.join(names) or None

          def machines(module):
              """Which machines a snapshot can ask for by name and find in this module.

              Read from the sources rather than by running anything: a machine says which model
              it is with a plain return, and this is the only place that can tell a person which
              jar to bring when a snapshot names a machine nobody here has.
              """
              found = []
              for source in sorted(glob.glob(module + '/src/main/java/**/*.java', recursive=True)):
                  for model in re.findall(r'snapshotModel\(\)\s*\{\s*return\s+MachineTypes\.(\w+)',
                                          open(source).read()):
                      if model not in found:
                          found.append(model)
              return found

          def opens(module):
              """Which files this module knows how to open, as a format itself says so.

              Read where a format answers whether a file is one of its own - handles, reads,
              opens, isATape - and nowhere else, so that a name mentioned in passing elsewhere
              does not make a jar claim a file it cannot read.
              """
              found = []
              for source in sorted(glob.glob(module + '/src/main/java/**/*.java', recursive=True)):
                  for body in re.findall(r'\b(?:handles|reads|opens|isATape)\s*\([^)]*\)\s*\{(.*?)\n\s{0,4}\}',
                                         open(source).read(), re.S):
                      for extension in re.findall(r'"\.(\w+)"', body):
                          if extension not in found:
                              found.append(extension)
              return found

          os.makedirs('jars', exist_ok=True)
          devices = []
          # The two small jars somebody writing a plugin needs go up as well: one is the word a
          # way in is marked with, the other is what writes the paperwork while their jar compiles.
          # Only what is here. The two jars somebody writing a plugin compiles against belong to
          # the emulator and are published from there: publishing them here as well would be two
          # releases of the same thing, drifting apart.
          for pom in sorted(glob.glob('devices/*/pom.xml') + glob.glob('tools/*/pom.xml')):
              module = os.path.dirname(pom)
              artifact = artifact_of(pom)
              if not artifact or not artifact.startswith(('device-', 'tool-')):
                  continue                      # the aggregator is not a plugin
              jars = [j for j in glob.glob(module + '/target/' + artifact + '-*.jar')
                      if not j.endswith(('-sources.jar', '-javadoc.jar'))]
              if not jars:
                  print('no jar for ' + artifact, file=sys.stderr)
                  continue
              shutil.copy(jars[0], 'jars/')
              # A machine has no window in the Equipment menu, so nothing there names it: what
              # the module calls itself does, and the folder is the last resort.
              devices.append({'artifact': artifact,
                              'title': called(module) or named(pom) or os.path.basename(module).capitalize(),
                              'machines': ' '.join(machines(module)),
                              'opens': ' '.join(opens(module))})

          for device in devices:
              print(device['artifact'] + ' -> ' + device['title'], file=sys.stderr)
          print(str(len(devices)) + ' devices', file=sys.stderr)
          with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
              out.write('devices=' + json.dumps(devices) + '\n')
          PY

      - name: Keep the jars
        uses: actions/upload-artifact@v4
        with:
          name: device-jars
          path: jars
          retention-days: 1

  release:
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        device: ${{ fromJson(needs.build.outputs.devices) }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: device-jars

      # Each board gets a release of its own, named after the board rather than after the module,
      # and recreated rather than added to: what is published is always what main builds today.
      - name: Publish ${{ matrix.device.artifact }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ matrix.device.artifact }}
          TITLE: ${{ matrix.device.title }}
          MACHINES: ${{ matrix.device.machines }}
          OPENS: ${{ matrix.device.opens }}
        run: |
          JAR=$(ls "$TAG"-*.jar | head -1)
          echo "publishing $TAG from $JAR"
          gh release delete "$TAG" --yes --cleanup-tag --repo "$GITHUB_REPOSITORY" || true
          {
            echo "**$TITLE** for [OOZX](https://github.com/fpetrola/oozx), built from \`main\` at"
            echo "[\`${GITHUB_SHA:0:9}\`](https://github.com/$GITHUB_REPOSITORY/commit/$GITHUB_SHA)."
            echo
            echo "A plugin is a jar: drop it in \`~/.oozx/plugins\` and the emulator finds what it brings."
            echo "How to write one, and every way in there is, are in"
            echo "[Extending OOZX](https://github.com/fpetrola/oozx/wiki/Extending-OOZX)."
            echo
            echo "See [Peripherals](https://github.com/fpetrola/oozx/wiki/Peripherals)."
            # Read back by the emulator: a snapshot naming a machine nobody has is answered with
            # the jars that bring it, picked out in the plugins window.
            if [ -n "$MACHINES" ]; then echo; echo "oozx-machines: $MACHINES"; fi
            if [ -n "$OPENS" ]; then echo; echo "oozx-opens: $OPENS"; fi
          } > notes.md
          gh release create "$TAG" "$JAR" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "$TITLE" \
            --notes-file notes.md
